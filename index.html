<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Home Hardware</title>
<meta name="description" content="A browsable directory of current smart home hardware, with part numbers and public prices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#" data-home>
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span>Smart Home Hardware</span>
    </a>

  </div>
</header>

<div class="layout">
  <aside id="filters" class="filters" aria-label="Filters">
<div class="filters-head only-mobile"><button id="close-filters" class="ghost" aria-label="Close filters">✕ Close</button></div>
    <div id="search-slot"><label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search products, brands, part numbers…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label></div>
    <section><h3>Category</h3><div id="f-cat"></div></section>
    <section><h3>Brand</h3><input id="brand-q" class="mini" type="search" placeholder="Find a brand…"><div id="f-brand" class="scroll"></div></section>
    <section><h3>Price <span class="unit">(AED)</span></h3>
      <div class="range"><input id="pmin" type="number" min="0" placeholder="Min" inputmode="numeric"><span>–</span><input id="pmax" type="number" min="0" placeholder="Max" inputmode="numeric"></div>
      <label class="chk"><input type="checkbox" id="f-priced"> Has a public price</label>
      <label class="chk"><input type="checkbox" id="f-gulf"> Priced in the UAE / Gulf</label>
    </section>
    <section id="sec-proto" hidden><h3>Works with</h3><div id="f-proto" class="chips"></div>
      <label class="chk"><input type="checkbox" id="f-local"> Local control (no cloud)</label>
      <label class="chk"><input type="checkbox" id="f-ha"> Home Assistant</label>
    </section>
    <section><h3>Status</h3><label class="chk"><input type="checkbox" id="f-ann" checked> Include announced products</label></section>
  </aside>

  <main id="main">
    <div id="loading" class="empty">Loading catalogue…</div>
    <div id="home" hidden></div>
    <article id="page" hidden></article>
    <div id="results" hidden>
      <div class="bar">
        <button id="open-filters" class="ghost only-mobile">Filters <span id="fcount"></span></button>
        <div id="crumbs" class="crumbs"></div><button id="clear" class="link clear">Clear all filters</button>
        <div class="bar-right">
          <span id="count" class="muted"></span>
          <label class="sel"><span>Group by</span><select id="group" aria-label="Group by">
            <option value="cat">Category</option><option value="brand">Brand</option><option value="line">Product line</option><option value="none">No grouping</option>
          </select></label>

        </div>
      </div>
      <div id="vendor"></div>
      <div id="sortinfo" class="sortinfo"></div>
      <div id="list"></div>
      <div id="more-wrap"><button id="more" class="ghost wide">Show more</button></div>
    </div>
  </main>
</div>

<div id="scrim" class="scrim" hidden></div>


<script src="assets/app.js"></script>
</body>
</html>
